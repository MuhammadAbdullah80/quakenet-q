<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Missing Bridge</title>
<style>
  body{margin:0;background:#0f1724;color:#f1f5f9;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:24px 16px}
  svg{width:100%;max-width:1080px;height:auto}
</style>
</head>
<body>
<svg viewBox="0 0 1080 720" role="img" aria-label="Two islands, seismology and quantum sensor placement, with a missing bridge between them that your team builds">
  <text x="540" y="62" text-anchor="middle" font-size="38" font-weight="800" fill="#f1f5f9">Two islands. No bridge yet.</text>
  <text x="540" y="98" text-anchor="middle" font-size="18" fill="#94a3b8">Why quantum seismometer placement is still an open gap</text>

  <!-- water -->
  <rect x="0" y="300" width="1080" height="260" fill="#12304a"/>
  <path d="M0 330 Q90 315 180 330 T360 330 T540 330 T720 330 T900 330 T1080 330" stroke="#1f4e75" stroke-width="3" fill="none"/>
  <path d="M0 500 Q90 485 180 500 T360 500 T540 500 T720 500 T900 500 T1080 500" stroke="#1f4e75" stroke-width="3" fill="none"/>

  <!-- left island -->
  <ellipse cx="220" cy="430" rx="210" ry="120" fill="#3f6b3a"/>
  <text x="220" y="395" text-anchor="middle" font-size="44">🌋📡</text>
  <text x="220" y="445" text-anchor="middle" font-size="22" font-weight="700">Seismology island</text>
  <text x="220" y="474" text-anchor="middle" font-size="15" fill="#e2e8f0">Optimal station placement</text>
  <text x="220" y="496" text-anchor="middle" font-size="15" fill="#e2e8f0">since the 1990s (classical)</text>

  <!-- right island -->
  <ellipse cx="860" cy="430" rx="210" ry="120" fill="#5b3a7a"/>
  <text x="860" y="395" text-anchor="middle" font-size="44">⚛️🌉</text>
  <text x="860" y="445" text-anchor="middle" font-size="22" font-weight="700">Quantum island</text>
  <text x="860" y="474" text-anchor="middle" font-size="15" fill="#e2e8f0">Sensor placement as QUBO:</text>
  <text x="860" y="496" text-anchor="middle" font-size="15" fill="#e2e8f0">bridges, water pipes</text>

  <!-- dashed bridge -->
  <path d="M430 410 Q540 330 650 410" stroke="#f59e0b" stroke-width="6" stroke-dasharray="14 12" fill="none"/>
  <text x="540" y="320" text-anchor="middle" font-size="40">🚧</text>
  <text x="540" y="430" text-anchor="middle" font-size="17" font-weight="700" fill="#fbbf24">your project</text>

  <!-- callout -->
  <rect x="190" y="590" width="700" height="90" rx="16" fill="#f59e0b"/>
  <text x="540" y="628" text-anchor="middle" font-size="22" font-weight="800" fill="#1c1917">Both halves already exist.</text>
  <text x="540" y="660" text-anchor="middle" font-size="22" font-weight="800" fill="#1c1917">Nobody has joined them yet.</text>
</svg>
</body>
</html>
